    <!-- TIME THEME: runs before React, sets data-time-slot + CSS vars instantly (no network, no flicker) -->
    <script>
      (function(){
        var root=document.documentElement;
        try {
          localStorage.removeItem("theme_preference");
          localStorage.removeItem("portfolio_theme");
        } catch(e){}
        var h=new Date().getHours()+(new Date().getMinutes()/60);
        var isNight=(h<6.0||h>=18.0);
        var slot=isNight?"night":"midday";
        if(isNight){
          root.classList.add("dark");
          root.setAttribute("data-sky","night");
          root.setAttribute("data-theme-bg","dark");
          root.setAttribute("data-time-slot","night");
          root.style.setProperty("--bg","#0A0A0A");
          root.style.setProperty("--port-bg","#0A0A0A");
          root.style.setProperty("--port-nav-bg","rgba(14,18,28,0.88)");
          root.style.setProperty("--port-text","#F5F5F5");
          root.style.setProperty("--port-accent","#6c99f4");
          root.style.setProperty("--grid","transparent");
          root.style.setProperty("--grid-major","transparent");
        }else{
          root.classList.remove("dark");
          root.setAttribute("data-sky","day");
          root.removeAttribute("data-theme-bg");
          root.setAttribute("data-time-slot","midday");
          root.style.setProperty("--bg","#FFFFFF");
          root.style.setProperty("--port-bg","#FFFFFF");
          root.style.setProperty("--port-nav-bg","rgba(255,255,255,0.90)");
          root.style.setProperty("--port-text","#0A0A0A");
          root.style.setProperty("--port-accent","#2563eb");
          root.style.setProperty("--grid","transparent");
          root.style.setProperty("--grid-major","transparent");
        }
      })();
    </script>

  <body>
